server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: todolist
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/todolist?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT settings
security:
  jwt:
    secret: change-this-to-a-strong-random-secret-which-you-should-store-securely
    access-token-ms: 900000   # 15 minutes
    refresh-token-ms: 1209600000 # 14 days (in ms)