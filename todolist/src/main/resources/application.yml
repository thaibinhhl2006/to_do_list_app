server:
  port: 8080

spring:
  application:
    name: todolist
  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT settings
security:
  jwt:
    secret: change-this-to-a-strong-random-secret-which-you-should-store-securely
    access-token-ms: 900000   # 15 minutes
    refresh-token-ms: 1209600000 # 14 days (in ms)